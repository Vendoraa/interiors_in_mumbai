# Hermes Agent Blog Pipeline Configuration
# Copy this to ~/.hermes/config.yaml or merge with existing config

# Model configuration
model:
  provider: openrouter
  model: anthropic/claude-sonnet-4-20250514
  # Alternative models:
  # provider: openai
  # model: gpt-4o
  # provider: anthropic
  # model: claude-sonnet-4-20250514

# Tool Gateway configuration (for image generation)
tool_gateway:
  enabled: true
  image_generation:
    provider: fal
    # FAL API key (set via hermes setup --portal or env var)
  web_search:
    provider: firecrawl
    # Firecrawl API key (set via hermes setup --portal or env var)

# MCP Servers
mcp:
  contentful:
    type: local
    command: ["npx", "-y", "@contentful/mcp-server"]
    env:
      CONTENTFUL_MANAGEMENT_ACCESS_TOKEN: ""
      SPACE_ID: "as5c0n8s85du"
      ENVIRONMENT_ID: "master"
      CONTENTFUL_HOST: "api.contentful.com"

# Skills
skills:
  paths:
    - ~/.hermes/skills/blog-content-writer
    - ~/.hermes/skills/blog-image-generator
    - ~/.hermes/skills/blog-humanizer
    - ~/.hermes/skills/blog-quality-reviewer
    - ~/.hermes/skills/blog-publisher
    - ~/.hermes/skills/blog-orchestrator

# Cron schedule for automated blog posting
cron:
  - name: "weekly-blog"
    schedule: "0 10 * * 1"  # Every Monday at 10 AM
    command: "Use the blog-orchestrator skill to generate and publish a blog post about Mumbai interior design. Pick a fresh topic that hasn't been covered recently."
    enabled: true

  - name: "biweekly-blog"
    schedule: "0 10 * * 4"  # Every Thursday at 10 AM
    command: "Use the blog-orchestrator skill to generate and publish a blog post about Mumbai interior design. Pick a fresh topic from a different category than last week."
    enabled: true

# Subagent configuration
subagents:
  blog-content-writer:
    model: anthropic/claude-sonnet-4-20250514
    timeout_minutes: 15
    tools: ["web_search", "file_write", "file_read"]

  blog-image-generator:
    model: anthropic/claude-sonnet-4-20250514
    timeout_minutes: 10
    tools: ["image_generation", "file_write", "file_read"]

  blog-humanizer:
    model: anthropic/claude-sonnet-4-20250514
    timeout_minutes: 10
    tools: ["file_write", "file_read"]

  blog-quality-reviewer:
    model: anthropic/claude-sonnet-4-20250514
    timeout_minutes: 10
    tools: ["file_write", "file_read"]

  blog-publisher:
    model: anthropic/claude-sonnet-4-20250514
    timeout_minutes: 15
    tools: ["mcp_contentful", "file_write", "file_read"]

# Working directory for blog pipeline
blog_pipeline:
  output_dir: ~/blog-pipeline-output
  max_retries: 2
  max_total_retries: 5
  keep_intermediates: true  # Keep draft files for debugging

# Logging
logging:
  level: info
  file: ~/.hermes/logs/blog-pipeline.log
