[build]
  base = "package"
  command = "echo 'Skipping build - deploying pre-rendered static files from deploy-build branch'"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_CONTENTFUL_SPACE,REACT_APP_CONTENTFUL_ACCESS_TOKEN,REACT_APP_CONTENTFUL_ENVIRONMENT,REACT_APP_EMAILJS_SERVICE_ID,REACT_APP_EMAILJS_TEMPLATE_ID,REACT_APP_EMAILJS_PUBLIC_KEY,REACT_APP_RECAPTCHA_SITE_KEY,REACT_APP_GA_MEASUREMENT_ID,REACT_APP_META_PIXEL_ID,REACT_APP_SITE_URL,REACT_APP_SITE_NAME,REACT_APP_FACEBOOK_URL,REACT_APP_INSTAGRAM_URL,REACT_APP_TWITTER_URL,REACT_APP_YOUTUBE_URL,REACT_APP_WHATSAPP_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"

[[headers]]
  for = "/llm.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"

[functions]
  directory = "netlify/functions"